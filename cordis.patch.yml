# dsh-assisstant bundle patch layer (package.json#dsh.bundle.patch).
#
# Four rows:
# 1. The settings row, top level because the settings page edits only
#    top-level rows. It holds every setting and the assistant list, hides both
#    presets from the preset lists, polls the balance, links WeChat bindings,
#    sends the daily brief, and runs the watchdog.
# 2. The sub-plugin group (as dsh-mnemon's group row): each child is an npm
#    package pinned in package.json#dependencies, limited to this plugin's
#    presets by its own `presets` setting, and switched off when the user also
#    installed the same plugin standalone (the Loader evaluates each child's
#    `disabled` at every mount decision). A profile that writes its composed
#    tree back into its root file may store that expression as a fixed `true`;
#    the group plugin drops such a literal, which this patch never sets.
#    complete-subagent offers workers only the models the settings row sets
#    through its service (`ownModel: false`), never the conversation's own.
# 3. The router preset: the family member's own conversation. A strict router
#    (as dsh-superagent-prototype's main Session): it reads, talks, sets
#    reminders, records simple information with the policy's record tools over
#    fixed files, and hands the rest to a worker with `delegate`; it has no
#    general file writes, no shell, no web, and no official subagent tool.
# 4. The worker preset every `delegate` child runs on: the standard preset's
#    working tools, with a shell whose foreground command moves to a
#    background job after 5 seconds so a message from the router is taken at
#    the next step.
- insert:
    - id: dsh-assisstant
      name: dsh-assisstant
    - id: dsh-assisstant-subplugins
      name: dsh-assisstant/bundle
      group: true
      config:
        - id: dsh-assisstant-complete-subagent
          name: complete-subagent
          config:
            presets: [dsh-assisstant, dsh-assisstant-worker]
            childPreset: dsh-assisstant-worker
            ownModel: false
          disabled: !!js "[...loader.entries()].some(e => e.options.id === 'complete-subagent' && !e.options.disabled)"
        - id: dsh-assisstant-im-robot
          name: im-robot
          config:
            presets: [dsh-assisstant]
          disabled: !!js "[...loader.entries()].some(e => e.options.id === 'im-robot' && !e.options.disabled)"
    - id: preset-dsh-assisstant
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-assisstant
        name: 助理
        description: 助理和家人的对话（隐藏，不供手动选择）。
        order: 90
        plugins:
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.9
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
              - id: dsh-assisstant-compactor
                name: dsh-assisstant/compactor
          - id: dsh-assisstant-policy
            name: dsh-assisstant/policy
            config:
              role: router
    - id: preset-dsh-assisstant-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-assisstant-worker
        name: 助理执行器
        description: 助理的后台子代理（隐藏，不供手动选择）。
        order: 91
        plugins:
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: shell
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              - id: bash-sandbox
                name: '@deepseek-ai/dsh-bash-sandbox'
                config:
                  timeoutMs: 5000
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            config:
              waitTimeoutMs: 5000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: dsh-assisstant-worker-policy
            name: dsh-assisstant/policy
            config:
              role: worker
